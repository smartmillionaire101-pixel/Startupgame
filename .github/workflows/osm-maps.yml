name: City maps from OpenStreetMap

# Builds the real city maps (apps/web/src/city/geo/*.json) from OpenStreetMap
# (© OpenStreetMap contributors, ODbL) and commits them to the branch. Then the
# 3D city data (Wave 9 §A, scripts/osm/tiles.mjs): every building (Overture
# Maps) in 1 km binary tiles, a terrain grid (AWS Terrarium tiles) and trees, into
# apps/web/public/geo/<city>/. GitHub's
# runners can reach the Overpass API and the OSM land polygons; the game never
# fetches map data at runtime.

on:
  push:
    paths:
      - 'scripts/osm/**'
      - '.github/workflows/osm-maps.yml'
  workflow_dispatch:

concurrency:
  group: osm-maps-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  maps:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies (pngjs for the terrain tiles; DuckDB for Overture)
        # The DuckDB extensions come as PyPI wheels pinned to DuckDB's version,
        # so nothing is fetched from DuckDB's extension server at run time.
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          pip install -q duckdb==1.5.5 duckdb-extension-spatial==1.5.5 duckdb-extension-httpfs==1.5.5
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin unzip
      - name: OSM land polygons (coastlines)
        run: |
          mkdir -p scripts/osm/work
          curl -sSL --retry 3 -o /tmp/land.zip https://osmdata.openstreetmap.de/download/land-polygons-split-4326.zip
          unzip -q /tmp/land.zip -d /tmp/land
          SHP=$(find /tmp/land -name 'land_polygons.shp' | head -1)
          node -e '
            import("./scripts/osm/cities.mjs").then(({ CITIES }) => {
              for (const [id, c] of Object.entries(CITIES)) console.log(id, ...c.wide);
            });
          ' | while read -r id w s e n; do
            ogr2ogr -f GeoJSON -spat "$w" "$s" "$e" "$n" -clipsrc "$w" "$s" "$e" "$n" \
              "scripts/osm/work/land-$id.geojson" "$SHP"
            echo "land $id: $(wc -c < "scripts/osm/work/land-$id.geojson") bytes"
          done
      - name: Build and commit each city (Overpass)
        # One commit per city, so a slow or failing Overpass mirror never loses
        # the cities already done; cities already in the repo are skipped.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for id in $(node -e 'import("./scripts/osm/cities.mjs").then(({ CITIES }) => console.log(Object.keys(CITIES).join(" ")))'); do
            if [ -f "apps/web/src/city/geo/$id.json" ]; then echo "skip $id (already built)"; continue; fi
            node scripts/osm/build.mjs "$id" || { echo "::warning::$id failed"; continue; }
            git add "apps/web/src/city/geo/$id.json"
            git commit -m "Maps: $id from OpenStreetMap (© OpenStreetMap contributors, ODbL)"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          done
      - name: 3D tiles, terrain and trees per city (Overture, AWS Terrarium)
        # Buildings: Overture Maps by bbox from its public GeoParquet on S3
        # (overture.py, DuckDB). Overpass is only asked for trees and streets,
        # and its failures are not fatal. Needs the city's geo JSON (water,
        # land, parks). One commit per city; a city whose index.json exists is
        # skipped (index.json is written last).
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for id in $(node -e 'import("./scripts/osm/cities.mjs").then(({ CITIES }) => console.log(Object.keys(CITIES).join(" ")))'); do
            if [ -f "apps/web/public/geo/$id/index.json" ]; then echo "skip 3D $id (already built)"; continue; fi
            if [ ! -f "apps/web/src/city/geo/$id.json" ]; then echo "::warning::3D $id needs its geo JSON first"; continue; fi
            bbox=$(node -e 'import("./scripts/osm/cities.mjs").then(({ CITIES }) => console.log(CITIES[process.argv[1]].wide.join(" ")))' "$id")
            # On failure, put the end of the log in the warning (job logs aren't always reachable).
            # shellcheck disable=SC2086
            if ! { python3 scripts/osm/overture.py "$id" $bbox && node scripts/osm/tiles.mjs "$id"; } > "/tmp/tiles-$id.log" 2>&1; then
              cat "/tmp/tiles-$id.log"
              echo "::warning title=3D $id failed::$(tail -c 1500 "/tmp/tiles-$id.log" | tr '\n' '|')"
              continue
            fi
            grep -v 'retry' "/tmp/tiles-$id.log" | tail -8
            rm -f "scripts/osm/work/buildings-$id.ndjson"
            du -sh "apps/web/public/geo/$id"
            git add "apps/web/public/geo/$id"
            git commit -m "3D city: $id buildings, terrain and trees (© OpenStreetMap contributors, Overture Maps Foundation)"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          done
