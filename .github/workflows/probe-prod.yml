name: Probe production
on:
  push:
    paths:
      - '.github/workflows/probe-prod.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe
        run: |
          U=https://runwaystartup.netlify.app
          for p in / /version.json /api/health /api/meta; do
            r=$(curl -sS -m 30 -o /tmp/b -w '%{http_code} %{time_total}s' "$U$p" 2>&1); echo "::warning title=GET $p::$r $(head -c 400 /tmp/b | tr '\n' ' ')"
          done
          r=$(curl -sS -m 30 -H 'x-runway: 1' -H 'content-type: application/json' -d '{"adult":true}' -D /tmp/h -o /tmp/b -w '%{http_code} %{time_total}s' "$U/api/auth/guest" 2>&1); echo "::warning title=POST guest::$r $(head -c 600 /tmp/b | tr '\n' ' ') $(grep -i x-runway /tmp/h | tr '\r\n' '  ')"
          node scripts/probe-deploy.mjs "$U" > /tmp/probe.txt 2>&1 || true
          echo "::warning title=probe::$(head -c 1500 /tmp/probe.txt | tr '\n' '|')"
