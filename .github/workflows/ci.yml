name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm 11 matches the lockfile generator and avoids an npm 10 resolver bug.
      - run: npx -y npm@11 ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/build-functions.mjs
      - run: npm audit --omit=dev --audit-level=high

  # The browser suite, split over four machines that run at once (about 12
  # minutes each instead of about 45 on one). The "e2e" job below reports
  # them as one check.
  e2e-shard:
    name: e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: check
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npx -y npm@11 ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npx playwright test --shard=${{ matrix.shard }}/4 --reporter=github,list
        working-directory: apps/web
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: apps/web/test-results

  e2e:
    runs-on: ubuntu-latest
    needs: e2e-shard
    if: always()
    steps:
      - run: test "${{ needs.e2e-shard.result }}" = success
