name: Deploy check

# Tests the game as Netlify actually serves it. Waits until the deployed site
# reports this commit (version.json), then:
#   - pull requests: the full end-to-end suite against the deploy preview,
#     which has its own isolated world and dev tools;
#   - main: the live smoke test against production, which cleans up after itself.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      url:
        description: Site URL to test (defaults to production)
        required: false
      suite:
        description: "'live' (safe for production) or 'full'"
        required: false
        default: live

concurrency:
  group: deploy-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SITE: ${{ vars.NETLIFY_SITE_NAME || 'runwaystartup' }}

jobs:
  deployed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Pick target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "url=https://deploy-preview-${{ github.event.pull_request.number }}--$SITE.netlify.app" >> "$GITHUB_OUTPUT"
            echo "commit=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
            echo "suite=full" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "url=https://$SITE.netlify.app" >> "$GITHUB_OUTPUT"
            echo "commit=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "suite=live" >> "$GITHUB_OUTPUT"
          else
            echo "url=${{ inputs.url || format('https://{0}.netlify.app', env.SITE) }}" >> "$GITHUB_OUTPUT"
            echo "commit=" >> "$GITHUB_OUTPUT"
            echo "suite=${{ inputs.suite || 'live' }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Wait for Netlify to serve this commit
        env:
          URL: ${{ steps.target.outputs.url }}
          COMMIT: ${{ steps.target.outputs.commit }}
        run: |
          for i in $(seq 1 90); do
            served=$(curl -fsS "$URL/version.json" 2>/dev/null | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p')
            health=$(curl -fsS -o /dev/null -w '%{http_code}' "$URL/api/health" 2>/dev/null || true)
            echo "try $i: serving ${served:-none}, api ${health:-none}"
            if { [ -z "$COMMIT" ] || [ "$served" = "$COMMIT" ]; } && [ "$health" = "200" ]; then
              curl -fsS "$URL/api/health"; echo
              exit 0
            fi
            # Show why the API is unhealthy (Netlify's function error page names the error).
            if [ "$health" != "200" ] && [ "$health" != "404" ] && [ $((i % 6)) -eq 1 ]; then
              curl -sS "$URL/api/health" | head -c 1500; echo
            fi
            sleep 10
          done
          curl -sS "$URL/api/health" | head -c 3000; echo
          echo "::error::$URL did not serve ${COMMIT:-a healthy build} within 15 minutes"
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npx -y npm@11 ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: End-to-end against ${{ steps.target.outputs.url }}
        run: npx playwright test
        working-directory: apps/web
        env:
          CI: '1'
          E2E_BASE_URL: ${{ steps.target.outputs.url }}
          E2E_SUITE: ${{ steps.target.outputs.suite }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: deployed-playwright-report
          path: apps/web/test-results
